name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (official command-line tools)
        run: |
          if [ -z "$ANDROID_HOME" ] || ! ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager >/dev/null 2>&1; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "SIGNING=permanent" >> $GITHUB_ENV
            echo "Using the permanent key from the KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair -keystore app/release.keystore -alias deficitcoach -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass deficitcoach -keypass deficitcoach -dname "CN=Deficit Coach Test, C=IN"
            echo "SIGNING=temporary" >> $GITHUB_ENV
            echo "::warning::No KEYSTORE_BASE64 secret. This APK uses a throwaway key: later builds will NOT install over it."
          fi

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          SUFFIX=""
          [ "$SIGNING" = "temporary" ] && SUFFIX="-test"
          cp app/build/outputs/apk/release/app-release.apk "DeficitCoach-v1.0.${{ github.run_number }}${SUFFIX}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DeficitCoach-apk
          path: DeficitCoach-*.apk

      - name: Publish as a GitHub Release (easy phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Deficit Coach v1.0.${{ github.run_number }}${{ env.SIGNING == 'temporary' && ' (test key)' || '' }}
          files: DeficitCoach-*.apk
          make_latest: true
